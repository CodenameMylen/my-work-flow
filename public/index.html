<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowCheck — Architecture Visualizer & Load Tester</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace']
          },
          colors: {
            slate: {
              850: '#111827',
              900: '#0f172a',
              950: '#030712'
            }
          }
        }
      }
    };
  </script>

  <!-- React 18 & ReactDOM 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- React Flow 11 CDN -->
  <link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css" />
  <script src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>

  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #030712;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* React Flow Dark Canvas */
    .react-flow__background {
      background-color: #030712 !important;
    }
    .react-flow__controls {
      background: #0f172a !important;
      border: 1px solid #1e293b !important;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6) !important;
      border-radius: 6px !important;
    }
    .react-flow__controls button {
      background: #0f172a !important;
      border-bottom: 1px solid #1e293b !important;
      color: #94a3b8 !important;
      fill: #94a3b8 !important;
    }
    .react-flow__controls button:hover {
      background: #1e293b !important;
      color: #38bdf8 !important;
      fill: #38bdf8 !important;
    }

    /* Custom Handles */
    .react-flow__handle {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #0284c7;
      border: 2px solid #0f172a;
    }
    .react-flow__handle:hover {
      transform: scale(1.4);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased font-sans select-none overflow-hidden h-screen flex flex-col">

  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;
    const RF = window.ReactFlow || {};
    const ReactFlow = RF.default || RF;
    const {
      Handle,
      Position,
      Background,
      Controls,
      MiniMap,
      applyNodeChanges,
      applyEdgeChanges,
      addEdge
    } = RF;

    // --- REUSABLE CLEAN SVG ICONS (NO EMOJIS) ---
    const Icon = ({ name, className = "w-4 h-4" }) => {
      switch (name) {
        case 'bolt':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          );
        case 'laptop':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
          );
        case 'server':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" />
            </svg>
          );
        case 'database':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
            </svg>
          );
        case 'service':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
          );
        case 'play':
          return (
            <svg className={className} fill="currentColor" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z" />
            </svg>
          );
        case 'stop':
          return (
            <svg className={className} fill="currentColor" viewBox="0 0 24 24">
              <rect x="6" y="6" width="12" height="12" rx="2" />
            </svg>
          );
        case 'plus':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
            </svg>
          );
        case 'edit':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
          );
        case 'copy':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
          );
        case 'link':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
            </svg>
          );
        case 'trash':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          );
        case 'save':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
            </svg>
          );
        case 'folder':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
            </svg>
          );
        case 'refresh':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          );
        case 'sliders':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
            </svg>
          );
        case 'layers':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
          );
        case 'check':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
            </svg>
          );
        case 'radio':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
          );
        case 'download':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
          );
        case 'upload':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            </svg>
          );
        case 'clock':
          return (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          );
        default:
          return null;
      }
    };

    const getNodeTypeIcon = (type) => {
      switch (type) {
        case 'Client': return 'laptop';
        case 'API': return 'bolt';
        case 'Server': return 'server';
        case 'Database': return 'database';
        case 'Service':
        default:
          return 'service';
      }
    };

    // --- Custom Service Node Component ---
    const CustomServiceNode = ({ data, selected }) => {
      const {
        name,
        serviceType,
        endpoint,
        method = 'GET',
        hits = 0,
        status = 'idle',
        statusLabel = '',
        avgResponseTime = 0
      } = data;

      let statusBorder = 'border-slate-800';
      let statusGlow = '';
      let statusDot = 'bg-slate-500';
      let badgeBg = 'bg-slate-800/80 text-slate-400 border-slate-700/60';
      let statusText = 'IDLE';

      if (status === 'healthy') {
        statusBorder = 'border-emerald-500/80';
        statusGlow = 'shadow-[0_0_16px_rgba(16,185,129,0.25)]';
        statusDot = 'bg-emerald-400';
        badgeBg = 'bg-emerald-950/70 text-emerald-300 border-emerald-800/60';
        statusText = statusLabel || 'HEALTHY';
      } else if (status === 'warning') {
        statusBorder = 'border-amber-500/80';
        statusGlow = 'shadow-[0_0_16px_rgba(245,158,11,0.25)]';
        statusDot = 'bg-amber-400';
        badgeBg = 'bg-amber-950/70 text-amber-300 border-amber-800/60';
        statusText = statusLabel || 'WARNING';
      } else if (status === 'overloaded') {
        statusBorder = 'border-rose-500/90';
        statusGlow = 'shadow-[0_0_20px_rgba(239,68,68,0.35)]';
        statusDot = 'bg-rose-400 animate-ping';
        badgeBg = 'bg-rose-950/80 text-rose-300 border-rose-800/60';
        statusText = statusLabel || 'OVERLOAD';
      }

      const typeBadgeColors = {
        Client: 'bg-blue-950/60 text-blue-400 border-blue-800/50',
        API: 'bg-purple-950/60 text-purple-400 border-purple-800/50',
        Server: 'bg-cyan-950/60 text-cyan-400 border-cyan-800/50',
        Database: 'bg-amber-950/60 text-amber-400 border-amber-800/50',
        Service: 'bg-indigo-950/60 text-indigo-400 border-indigo-800/50'
      };

      return (
        <div className={`relative rounded-xl bg-slate-900 border transition-all duration-200 ${statusBorder} ${statusGlow} ${selected ? 'ring-2 ring-sky-400 scale-[1.02]' : ''} min-w-[210px] shadow-lg cursor-pointer`}>
          <Handle type="target" position={Position.Left} className="!-left-1.5" />

          {/* Node Header */}
          <div className="px-3.5 py-2.5 border-b border-slate-800/80 flex items-center justify-between gap-2">
            <div className="flex items-center gap-2 min-w-0">
              <div className="p-1 rounded-md bg-slate-800 text-slate-300">
                <Icon name={getNodeTypeIcon(serviceType)} className="w-3.5 h-3.5" />
              </div>
              <span className="font-medium text-xs text-slate-200 truncate">{name}</span>
            </div>
            <span className={`text-[9px] font-mono tracking-wider px-1.5 py-0.5 rounded border uppercase ${typeBadgeColors[serviceType] || 'bg-slate-800 text-slate-300'}`}>
              {serviceType}
            </span>
          </div>

          {/* Endpoint & Method Tag */}
          {endpoint ? (
            <div className="px-3 py-1 bg-slate-950/70 border-b border-slate-800/50 flex items-center justify-between gap-1.5 font-mono text-[10px]">
              <div className="flex items-center gap-1.5 truncate">
                <span className="text-[9px] font-bold text-sky-400 px-1 py-0.2 bg-sky-950/80 rounded border border-sky-800/40">
                  {method || 'GET'}
                </span>
                <span className="text-slate-300 truncate max-w-[125px]" title={endpoint}>
                  {endpoint.replace(/^https?:\/\/[^\/]+/, '') || '/'}
                </span>
              </div>
              {avgResponseTime > 0 && (
                <span className="text-sky-300 text-[9px] font-semibold">
                  {avgResponseTime}ms
                </span>
              )}
            </div>
          ) : null}

          {/* Node Metrics Footer */}
          <div className="px-3.5 py-2.5 flex items-center justify-between text-xs">
            <div className="flex flex-col">
              <span className="text-[9px] uppercase tracking-wider text-slate-500 font-mono">Requests</span>
              <span className="font-mono font-semibold text-xs text-slate-200">
                {hits.toLocaleString()}
              </span>
            </div>
            <div className={`flex items-center gap-1.5 px-2 py-0.5 rounded-full border text-[10px] font-mono font-medium ${badgeBg}`}>
              <span className={`w-1.5 h-1.5 rounded-full ${statusDot}`}></span>
              <span>{statusText}</span>
            </div>
          </div>

          <Handle type="source" position={Position.Right} className="!-right-1.5" />
        </div>
      );
    };

    // --- Custom Animated Flow Edge ---
    const CustomAnimatedFlowEdge = ({
      id,
      sourceX,
      sourceY,
      targetX,
      targetY,
      sourcePosition = Position.Right,
      targetPosition = Position.Left,
      data = {}
    }) => {
      let edgePath = '';
      if (RF.getBezierPath) {
        const [path] = RF.getBezierPath({
          sourceX,
          sourceY,
          sourcePosition,
          targetX,
          targetY,
          targetPosition,
        });
        edgePath = path;
      } else {
        const dx = Math.abs(targetX - sourceX) * 0.5;
        edgePath = `M ${sourceX} ${sourceY} C ${sourceX + dx} ${sourceY}, ${targetX - dx} ${targetY}, ${targetX} ${targetY}`;
      }

      const isFlowing = data.isFlowing || false;
      const status = data.status || 'idle';
      const particleCount = data.particleCount || 4;

      let lineColor = '#334155';
      let dotColor = '#10b981';
      let speed = '0.7s';
      let speedNum = 0.7;
      let strokeWidth = 2;

      if (isFlowing) {
        if (status === 'healthy') {
          lineColor = '#10b981';
          dotColor = '#34d399';
          speed = '0.65s';
          speedNum = 0.65;
          strokeWidth = 3;
        } else if (status === 'warning') {
          lineColor = '#f59e0b';
          dotColor = '#fbbf24';
          speed = '1.2s';
          speedNum = 1.2;
          strokeWidth = 3;
        } else if (status === 'overloaded') {
          lineColor = '#ef4444';
          dotColor = '#f87171';
          speed = '2.0s';
          speedNum = 2.0;
          strokeWidth = 3.5;
        }
      }

      const particles = [];
      const totalDots = isFlowing ? (status === 'overloaded' ? Math.max(4, particleCount) : particleCount) : 0;
      for (let i = 0; i < totalDots; i++) {
        const beginTime = (speedNum / totalDots) * i;
        particles.push(
          <circle key={i} r="3.8" fill={dotColor} style={{ filter: `drop-shadow(0 0 5px ${dotColor})` }}>
            <animateMotion dur={speed} begin={`${beginTime.toFixed(2)}s`} repeatCount="indefinite" path={edgePath} />
          </circle>
        );
      }

      return (
        <g className="react-flow__edge">
          <path
            id={id}
            className="react-flow__edge-path"
            d={edgePath}
            fill="none"
            stroke={lineColor}
            strokeWidth={strokeWidth}
            strokeOpacity={isFlowing ? 0.9 : 0.4}
            style={{
              filter: isFlowing ? `drop-shadow(0 0 6px ${lineColor})` : 'none',
              transition: 'stroke 0.25s ease, stroke-width 0.25s ease'
            }}
          />
          {isFlowing && <g>{particles}</g>}
        </g>
      );
    };

    const nodeTypes = { customService: CustomServiceNode };
    const edgeTypes = {
      default: CustomAnimatedFlowEdge,
      animatedFlow: CustomAnimatedFlowEdge
    };

    // --- Main App Component ---
    function App() {
      // MULTI-FLOW STATE
      const [flows, setFlows] = useState([]);
      const [activeFlowId, setActiveFlowId] = useState('flow-ecommerce');

      const [nodes, setNodes] = useState([]);
      const [edges, setEdges] = useState([]);
      const [baseUrl, setBaseUrl] = useState('http://localhost:4000');
      
      const [selectedNode, setSelectedNode] = useState(null);
      const [selectedEdge, setSelectedEdge] = useState(null);

      // Testing Execution Mode: 'pipeline' (sequential request chaining) or 'single' (stress 1 node)
      const [testMode, setTestMode] = useState('pipeline');

      // Load test config
      const [targetNodeId, setTargetNodeId] = useState('');
      const [totalRequests, setTotalRequests] = useState(300);
      const [concurrency, setConcurrency] = useState(10);
      const [activeTestId, setActiveTestId] = useState(null);
      const [testStatus, setTestStatus] = useState('idle');
      const [testMetrics, setTestMetrics] = useState({
        sent: 0,
        success: 0,
        failed: 0,
        avgResponseTime: 0,
        rps: 0
      });

      // Status Evaluation Criteria
      const [criteriaMode, setCriteriaMode] = useState('by_latency');
      const [reqWarningThreshold, setReqWarningThreshold] = useState(300);
      const [reqOverloadThreshold, setReqOverloadThreshold] = useState(700);
      const [warningLatency, setWarningLatency] = useState(100);
      const [overloadLatency, setOverloadLatency] = useState(250);

      // Modals
      const [showAddNodeModal, setShowAddNodeModal] = useState(false);
      const [showEditNodeModal, setShowEditNodeModal] = useState(false);
      const [showAddEdgeModal, setShowAddEdgeModal] = useState(false);
      const [showNewFlowModal, setShowNewFlowModal] = useState(false);
      const [showRenameFlowModal, setShowRenameFlowModal] = useState(false);

      // Node Inspector & Single Ping State
      const [isPinging, setIsPinging] = useState(false);
      const [pingResult, setPingResult] = useState(null);

      const [toastMessage, setToastMessage] = useState(null);
      const fileInputRef = useRef(null);

      // Node Form State
      const [nodeFormName, setNodeFormName] = useState('');
      const [nodeFormType, setNodeFormType] = useState('API');
      const [nodeFormEndpoint, setNodeFormEndpoint] = useState('');
      const [nodeFormMethod, setNodeFormMethod] = useState('GET');

      // Flow Name Form State
      const [flowFormName, setFlowFormName] = useState('');

      // Edge Form State
      const [edgeSource, setEdgeSource] = useState('');
      const [edgeTarget, setEdgeTarget] = useState('');

      const pollingTimerRef = useRef(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const getParticleCount = (reqCount) => {
        if (reqCount <= 100) return 2;
        if (reqCount <= 500) return 4;
        return 6;
      };

      const evaluateHealth = (sent, success, failed, avgResponseTime) => {
        if (sent === 0) return { status: 'idle', label: 'IDLE' };

        if (criteriaMode === 'by_total_requests') {
          if (sent >= reqOverloadThreshold) return { status: 'overloaded', label: 'OVERLOAD' };
          if (sent >= reqWarningThreshold) return { status: 'warning', label: 'HIGH LOAD' };
          return { status: 'healthy', label: 'NORMAL' };
        }

        if (avgResponseTime >= overloadLatency || (failed / sent) > 0.25) {
          return { status: 'overloaded', label: 'OVERLOAD' };
        }
        if (avgResponseTime >= warningLatency || (failed / sent) > 0.05) {
          return { status: 'warning', label: 'DEGRADED' };
        }
        return { status: 'healthy', label: 'HEALTHY' };
      };

      // Load initial config from server
      useEffect(() => {
        fetch('/api/config/load')
          .then(res => res.json())
          .then(data => {
            if (data.flows && data.flows.length) {
              setFlows(data.flows);
              const activeId = data.activeFlowId || data.flows[0].id;
              setActiveFlowId(activeId);
              const active = data.flows.find(f => f.id === activeId) || data.flows[0];
              setNodes(active.nodes || []);
              setEdges((active.edges || []).map(e => ({
                ...e,
                type: 'animatedFlow',
                data: { isFlowing: false, status: 'idle', particleCount: 3 }
              })));
              setBaseUrl(active.baseUrl || 'http://localhost:4000');
            }
          })
          .catch(err => console.error('Failed to load initial config:', err));
      }, []);

      // Synchronize current active flow state into flows array
      const syncCurrentFlow = useCallback((updatedNodes, updatedEdges, updatedBaseUrl) => {
        setFlows(prevFlows => prevFlows.map(f => {
          if (f.id === activeFlowId) {
            return {
              ...f,
              nodes: updatedNodes !== undefined ? updatedNodes : nodes,
              edges: updatedEdges !== undefined ? updatedEdges : edges,
              baseUrl: updatedBaseUrl !== undefined ? updatedBaseUrl : baseUrl
            };
          }
          return f;
        }));
      }, [activeFlowId, nodes, edges, baseUrl]);

      // Switch Flow
      const handleSwitchFlow = (flowId) => {
        if (flowId === activeFlowId) return;
        syncCurrentFlow(nodes, edges, baseUrl);

        const targetFlow = flows.find(f => f.id === flowId);
        if (targetFlow) {
          setActiveFlowId(flowId);
          setNodes(targetFlow.nodes || []);
          setEdges((targetFlow.edges || []).map(e => ({
            ...e,
            type: 'animatedFlow',
            data: { isFlowing: false, status: 'idle', particleCount: 3 }
          })));
          setBaseUrl(targetFlow.baseUrl || 'http://localhost:4000');
          setSelectedNode(null);
          setSelectedEdge(null);
          setPingResult(null);
          setTestStatus('idle');
          showToast(`Switched to "${targetFlow.name}"`);
        }
      };

      // Add New Flow
      const handleCreateFlowSubmit = (e) => {
        e.preventDefault();
        if (!flowFormName.trim()) return;

        const newId = `flow-${Date.now()}`;
        const newFlow = {
          id: newId,
          name: flowFormName.trim(),
          baseUrl: 'http://localhost:4000',
          nodes: [
            {
              id: 'node-client-new',
              type: 'customService',
              position: { x: 50, y: 150 },
              data: { name: 'Client App', serviceType: 'Client', endpoint: '', hits: 0, status: 'idle', statusLabel: 'IDLE' }
            },
            {
              id: 'node-api-new',
              type: 'customService',
              position: { x: 280, y: 150 },
              data: { name: 'API Gateway', serviceType: 'API', endpoint: 'http://localhost:4000/api/mock/gateway', hits: 0, status: 'idle', statusLabel: 'IDLE' }
            }
          ],
          edges: [
            { id: `edge-new-${Date.now()}`, source: 'node-client-new', target: 'node-api-new', type: 'animatedFlow', data: { isFlowing: false, status: 'idle', particleCount: 3 } }
          ]
        };

        const updatedFlows = [...flows, newFlow];
        setFlows(updatedFlows);
        setShowNewFlowModal(false);
        setFlowFormName('');

        setActiveFlowId(newId);
        setNodes(newFlow.nodes);
        setEdges(newFlow.edges);
        setBaseUrl(newFlow.baseUrl);
        setSelectedNode(null);
        setSelectedEdge(null);
        setTargetNodeId('node-api-new');
        setTestStatus('idle');
        showToast(`Created new flow "${newFlow.name}"!`);
      };

      // Duplicate Current Flow
      const handleDuplicateFlow = () => {
        const current = flows.find(f => f.id === activeFlowId);
        if (!current) return;

        const newId = `flow-${Date.now()}`;
        const duplicated = {
          ...current,
          id: newId,
          name: `${current.name} (Copy)`,
          nodes: JSON.parse(JSON.stringify(nodes)),
          edges: JSON.parse(JSON.stringify(edges)),
          baseUrl: baseUrl
        };

        const updatedFlows = [...flows, duplicated];
        setFlows(updatedFlows);
        setActiveFlowId(newId);
        showToast(`Duplicated into "${duplicated.name}"!`);
      };

      // Rename Current Flow
      const handleRenameFlowSubmit = (e) => {
        e.preventDefault();
        if (!flowFormName.trim()) return;

        setFlows(prev => prev.map(f => f.id === activeFlowId ? { ...f, name: flowFormName.trim() } : f));
        setShowRenameFlowModal(false);
        showToast(`Flow renamed to "${flowFormName.trim()}".`);
      };

      // Delete Current Flow
      const handleDeleteFlow = () => {
        if (flows.length <= 1) {
          showToast('Cannot delete the only remaining flow.');
          return;
        }

        const remaining = flows.filter(f => f.id !== activeFlowId);
        setFlows(remaining);
        const nextFlow = remaining[0];
        setActiveFlowId(nextFlow.id);
        setNodes(nextFlow.nodes || []);
        setEdges((nextFlow.edges || []).map(e => ({
          ...e,
          type: 'animatedFlow',
          data: { isFlowing: false, status: 'idle', particleCount: 3 }
        })));
        setBaseUrl(nextFlow.baseUrl || 'http://localhost:4000');
        showToast(`Flow deleted. Switched to "${nextFlow.name}".`);
      };

      // Auto-select target node if empty
      useEffect(() => {
        if (!targetNodeId && nodes.length > 0) {
          const nodeWithEndpoint = nodes.find(n => n.data && n.data.endpoint);
          if (nodeWithEndpoint) setTargetNodeId(nodeWithEndpoint.id);
        }
      }, [nodes, targetNodeId]);

      // Polling test status
      useEffect(() => {
        if (activeTestId && testStatus === 'running') {
          pollingTimerRef.current = setInterval(async () => {
            try {
              const res = await fetch(`/api/test/status/${activeTestId}`);
              if (!res.ok) return;
              const statusData = await res.json();

              setTestMetrics({
                sent: statusData.sent || 0,
                success: statusData.success || 0,
                failed: statusData.failed || 0,
                avgResponseTime: statusData.avgResponseTime || 0,
                rps: statusData.rps || 0
              });

              const nodeStats = statusData.nodeStats || {};
              const particles = getParticleCount(statusData.sent || totalRequests);

              // Update nodes with their REAL individual statistics from server
              setNodes(prev => prev.map(node => {
                const stat = nodeStats[node.id];
                if (stat) {
                  let nStatus = 'healthy';
                  let nLabel = `${stat.avgResponseTime}ms`;
                  if (stat.failed > 0 || (stat.lastStatusCode && stat.lastStatusCode >= 400)) {
                    nStatus = 'overloaded';
                    nLabel = `ERR ${stat.lastStatusCode || '500'}`;
                  } else if (stat.avgResponseTime >= warningLatency) {
                    nStatus = 'warning';
                    nLabel = `SLOW ${stat.avgResponseTime}ms`;
                  }

                  return {
                    ...node,
                    data: {
                      ...node.data,
                      hits: stat.sent,
                      status: nStatus,
                      statusLabel: nLabel,
                      avgResponseTime: stat.avgResponseTime
                    }
                  };
                }
                return node;
              }));

              // Flowing edges
              setEdges(prev => prev.map(edge => {
                const targetStat = nodeStats[edge.target];
                const sourceStat = nodeStats[edge.source];
                const isPart = Boolean(targetStat || sourceStat);

                let edgeStatus = 'healthy';
                if (targetStat) {
                  if (targetStat.failed > 0 || targetStat.avgResponseTime >= overloadLatency) {
                    edgeStatus = 'overloaded';
                  } else if (targetStat.avgResponseTime >= warningLatency) {
                    edgeStatus = 'warning';
                  }
                }

                return {
                  ...edge,
                  type: 'animatedFlow',
                  data: {
                    isFlowing: isPart,
                    status: edgeStatus,
                    particleCount: particles
                  }
                };
              }));

              if (statusData.status === 'done' || statusData.status === 'stopped') {
                setTestStatus(statusData.status);
                clearInterval(pollingTimerRef.current);
                setEdges(prev => prev.map(edge => ({
                  ...edge,
                  data: { ...edge.data, isFlowing: false }
                })));
              }
            } catch (err) {
              console.error('Polling error:', err);
            }
          }, 300);
        }

        return () => {
          if (pollingTimerRef.current) clearInterval(pollingTimerRef.current);
        };
      }, [activeTestId, testStatus, warningLatency, overloadLatency, totalRequests]);

      const onNodesChange = useCallback((changes) => setNodes((nds) => applyNodeChanges(changes, nds)), []);
      const onEdgesChange = useCallback((changes) => setEdges((eds) => applyEdgeChanges(changes, eds)), []);
      const onConnect = useCallback((params) => {
        setEdges((eds) => addEdge({
          ...params,
          type: 'animatedFlow',
          data: { isFlowing: testStatus === 'running', status: 'idle', particleCount: 3 }
        }, eds));
      }, [testStatus]);

      const onSelectionChange = useCallback((elements) => {
        const selNodes = elements.nodes || [];
        const selEdges = elements.edges || [];
        const activeNode = selNodes.length > 0 ? selNodes[0] : null;
        setSelectedNode(activeNode);
        setSelectedEdge(selEdges.length > 0 ? selEdges[0] : null);
        if (activeNode) {
          setPingResult(null);
        }
      }, []);

      // Build sequential pipeline list based on graph dependencies
      const buildPipelineSequence = () => {
        // Collect nodes that have an endpoint
        const nodesWithEndpoint = nodes.filter(n => n.data && n.data.endpoint && n.data.endpoint.trim().length > 0);
        if (nodesWithEndpoint.length === 0) return [];

        // Topological / dependency sorting based on edges
        const inDegree = {};
        const adj = {};
        nodesWithEndpoint.forEach(n => {
          inDegree[n.id] = 0;
          adj[n.id] = [];
        });

        edges.forEach(e => {
          if (inDegree[e.target] !== undefined && inDegree[e.source] !== undefined) {
            inDegree[e.target]++;
            adj[e.source].push(e.target);
          }
        });

        const queue = nodesWithEndpoint.filter(n => inDegree[n.id] === 0).map(n => n.id);
        const order = [];

        while (queue.length > 0) {
          const u = queue.shift();
          order.push(u);
          if (adj[u]) {
            adj[u].forEach(v => {
              inDegree[v]--;
              if (inDegree[v] === 0) queue.push(v);
            });
          }
        }

        // Add any remaining unconnected nodes
        nodesWithEndpoint.forEach(n => {
          if (!order.includes(n.id)) order.push(n.id);
        });

        return order.map(id => {
          const n = nodes.find(item => item.id === id);
          let url = n.data.endpoint;
          if (!url.startsWith('http://') && !url.startsWith('https://')) {
            url = `${baseUrl.replace(/\/$/, '')}/${url.replace(/^\//, '')}`;
          }
          return {
            nodeId: n.id,
            url,
            method: n.data.method || 'GET'
          };
        });
      };

      // Run Load Test
      const handleRunTest = async () => {
        let payload = {
          totalRequests: parseInt(totalRequests, 10),
          concurrency: parseInt(concurrency, 10)
        };

        if (testMode === 'pipeline') {
          const pipelineSteps = buildPipelineSequence();
          if (pipelineSteps.length === 0) {
            showToast('No nodes have an endpoint configured for pipeline.');
            return;
          }
          payload.pipeline = pipelineSteps;
        } else {
          // Single target mode
          const targetNode = nodes.find(n => n.id === targetNodeId);
          if (!targetNode || !targetNode.data.endpoint) {
            showToast('Select a node with an endpoint URL.');
            return;
          }
          let targetUrl = targetNode.data.endpoint;
          if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
            targetUrl = `${baseUrl.replace(/\/$/, '')}/${targetUrl.replace(/^\//, '')}`;
          }
          payload.url = targetUrl;
          payload.method = targetNode.data.method || 'GET';
        }

        try {
          const res = await fetch('/api/test/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const err = await res.json();
            showToast(`Error: ${err.error}`);
            return;
          }

          const { testId } = await res.json();
          setActiveTestId(testId);
          setTestStatus('running');
          setTestMetrics({ sent: 0, success: 0, failed: 0, avgResponseTime: 0, rps: 0 });

          // Start flowing particles
          const initialParticles = getParticleCount(totalRequests);
          setEdges(prev => prev.map(e => ({
            ...e,
            type: 'animatedFlow',
            data: {
              isFlowing: true,
              status: 'healthy',
              particleCount: initialParticles
            }
          })));

          showToast(`Test started in ${testMode === 'pipeline' ? 'Pipeline Flow' : 'Single Target'} Mode!`);
        } catch (err) {
          showToast(`Failed to start test: ${err.message}`);
        }
      };

      const handleStopTest = async () => {
        if (!activeTestId) return;
        try {
          await fetch('/api/test/stop', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ testId: activeTestId })
          });
          setTestStatus('stopped');
          setEdges(prev => prev.map(e => ({
            ...e,
            data: { ...e.data, isFlowing: false }
          })));
          showToast('Test stopped.');
        } catch (err) {
          showToast(`Failed to stop test: ${err.message}`);
        }
      };

      // Quick 1-Request Ping for Selected Node
      const handleQuickPingNode = async (node) => {
        const target = node || selectedNode;
        if (!target || !target.data.endpoint) {
          showToast('Node has no endpoint URL.');
          return;
        }

        let targetUrl = target.data.endpoint;
        if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
          targetUrl = `${baseUrl.replace(/\/$/, '')}/${targetUrl.replace(/^\//, '')}`;
        }

        setIsPinging(true);
        setPingResult(null);

        try {
          const res = await fetch('/api/test/ping', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              url: targetUrl,
              method: target.data.method || 'GET'
            })
          });

          const data = await res.json();
          setPingResult(data);

          // Update node status based on ping
          setNodes(prev => prev.map(n => {
            if (n.id === target.id) {
              const isOk = data.ok;
              return {
                ...n,
                data: {
                  ...n.data,
                  hits: (n.data.hits || 0) + 1,
                  status: isOk ? (data.durationMs > warningLatency ? 'warning' : 'healthy') : 'overloaded',
                  statusLabel: isOk ? `${data.durationMs}ms` : `ERR ${data.status}`,
                  avgResponseTime: data.durationMs
                }
              };
            }
            return n;
          }));

          showToast(`Ping completed: HTTP ${data.status} in ${data.durationMs}ms`);
        } catch (err) {
          setPingResult({ ok: false, error: err.message, status: 0, durationMs: 0 });
          showToast(`Ping failed: ${err.message}`);
        } finally {
          setIsPinging(false);
        }
      };

      // Save Flow
      const handleSaveFlow = async () => {
        const updatedFlows = flows.map(f => {
          if (f.id === activeFlowId) {
            return { ...f, nodes, edges, baseUrl };
          }
          return f;
        });
        setFlows(updatedFlows);

        try {
          const res = await fetch('/api/config/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              flows: updatedFlows,
              activeFlowId,
              nodes,
              edges,
              baseUrl
            })
          });
          if (res.ok) showToast('Flows saved to flowcheck.config.json');
        } catch (err) {
          showToast(`Failed to save: ${err.message}`);
        }
      };

      // Load Flow
      const handleLoadFlow = async () => {
        try {
          const res = await fetch('/api/config/load');
          const data = await res.json();
          if (data.flows && data.flows.length) {
            setFlows(data.flows);
            const activeId = data.activeFlowId || data.flows[0].id;
            setActiveFlowId(activeId);
            const active = data.flows.find(f => f.id === activeId) || data.flows[0];
            setNodes(active.nodes || []);
            setEdges((active.edges || []).map(e => ({
              ...e,
              type: 'animatedFlow',
              data: { isFlowing: false, status: 'idle', particleCount: 3 }
            })));
            setBaseUrl(active.baseUrl || 'http://localhost:4000');
            showToast('Flows reloaded from file.');
          }
        } catch (err) {
          showToast(`Failed to load: ${err.message}`);
        }
      };

      // Export JSON
      const handleExportJson = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
          activeFlowId,
          flows,
          baseUrl
        }, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `flowcheck-${activeFlowId}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast('Exported flow configuration JSON');
      };

      // Import JSON
      const handleImportJson = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.flows && Array.isArray(parsed.flows)) {
              setFlows(parsed.flows);
              const activeId = parsed.activeFlowId || parsed.flows[0].id;
              setActiveFlowId(activeId);
              const active = parsed.flows.find(f => f.id === activeId) || parsed.flows[0];
              setNodes(active.nodes || []);
              setEdges((active.edges || []).map(edge => ({
                ...edge,
                type: 'animatedFlow',
                data: { isFlowing: false, status: 'idle', particleCount: 3 }
              })));
              setBaseUrl(active.baseUrl || 'http://localhost:4000');
              showToast('Imported flows successfully!');
            } else if (parsed.nodes) {
              setNodes(parsed.nodes);
              setEdges((parsed.edges || []).map(edge => ({
                ...edge,
                type: 'animatedFlow',
                data: { isFlowing: false, status: 'idle', particleCount: 3 }
              })));
              showToast('Imported single diagram successfully!');
            }
          } catch (err) {
            showToast('Invalid JSON file format.');
          }
        };
        reader.readAsText(file);
      };

      const handleResetStatus = () => {
        setNodes(nds => nds.map(n => ({
          ...n,
          data: { ...n.data, hits: 0, status: 'idle', statusLabel: 'IDLE', avgResponseTime: 0 }
        })));
        setEdges(eds => eds.map(e => ({
          ...e,
          data: { ...e.data, isFlowing: false, status: 'idle' }
        })));
        setTestMetrics({ sent: 0, success: 0, failed: 0, avgResponseTime: 0, rps: 0 });
        setTestStatus('idle');
        setPingResult(null);
        showToast('Status & metrics reset.');
      };

      // Add Node Modal Submit
      const handleAddNodeSubmit = (e) => {
        e.preventDefault();
        if (!nodeFormName.trim()) return;

        const newNodeId = `node-${Date.now()}`;
        const newNode = {
          id: newNodeId,
          type: 'customService',
          position: { x: 100 + Math.random() * 200, y: 120 + Math.random() * 150 },
          data: {
            name: nodeFormName.trim(),
            serviceType: nodeFormType,
            endpoint: nodeFormEndpoint.trim(),
            method: nodeFormMethod,
            hits: 0,
            status: 'idle',
            statusLabel: 'IDLE'
          }
        };

        const updated = [...nodes, newNode];
        setNodes(updated);
        syncCurrentFlow(updated, edges, baseUrl);
        setShowAddNodeModal(false);
        setNodeFormName('');
        setNodeFormEndpoint('');
        showToast(`Node "${newNode.data.name}" added!`);
      };

      // Edit Node Modal Open
      const handleOpenEditNode = () => {
        if (!selectedNode) return;
        setNodeFormName(selectedNode.data.name || '');
        setNodeFormType(selectedNode.data.serviceType || 'API');
        setNodeFormEndpoint(selectedNode.data.endpoint || '');
        setNodeFormMethod(selectedNode.data.method || 'GET');
        setShowEditNodeModal(true);
      };

      // Edit Node Modal Submit
      const handleEditNodeSubmit = (e) => {
        e.preventDefault();
        if (!selectedNode || !nodeFormName.trim()) return;

        const updatedNodes = nodes.map(n => {
          if (n.id === selectedNode.id) {
            return {
              ...n,
              data: {
                ...n.data,
                name: nodeFormName.trim(),
                serviceType: nodeFormType,
                endpoint: nodeFormEndpoint.trim(),
                method: nodeFormMethod
              }
            };
          }
          return n;
        });

        setNodes(updatedNodes);
        syncCurrentFlow(updatedNodes, edges, baseUrl);
        setSelectedNode(updatedNodes.find(n => n.id === selectedNode.id));
        setShowEditNodeModal(false);
        showToast(`Node "${nodeFormName.trim()}" updated.`);
      };

      // Add Edge Modal Submit
      const handleAddEdgeSubmit = (e) => {
        e.preventDefault();
        if (!edgeSource || !edgeTarget || edgeSource === edgeTarget) return;

        const newEdge = {
          id: `edge-${edgeSource}-${edgeTarget}-${Date.now()}`,
          source: edgeSource,
          target: edgeTarget,
          type: 'animatedFlow',
          data: { isFlowing: false, status: 'idle', particleCount: 3 }
        };

        const updated = [...edges, newEdge];
        setEdges(updated);
        syncCurrentFlow(nodes, updated, baseUrl);
        setShowAddEdgeModal(false);
        setEdgeSource('');
        setEdgeTarget('');
        showToast('Nodes connected.');
      };

      const handleDeleteSelected = () => {
        if (selectedNode) {
          const updatedNodes = nodes.filter(n => n.id !== selectedNode.id);
          const updatedEdges = edges.filter(e => e.source !== selectedNode.id && e.target !== selectedNode.id);
          setNodes(updatedNodes);
          setEdges(updatedEdges);
          syncCurrentFlow(updatedNodes, updatedEdges, baseUrl);
          setSelectedNode(null);
          setPingResult(null);
          showToast('Node deleted.');
        } else if (selectedEdge) {
          const updatedEdges = edges.filter(e => e.id !== selectedEdge.id);
          setEdges(updatedEdges);
          syncCurrentFlow(nodes, updatedEdges, baseUrl);
          setSelectedEdge(null);
          showToast('Edge deleted.');
        }
      };

      const activeFlow = flows.find(f => f.id === activeFlowId) || { name: 'Active Flow' };
      const currentHealth = evaluateHealth(testMetrics.sent, testMetrics.success, testMetrics.failed, testMetrics.avgResponseTime);
      const successRate = testMetrics.sent > 0 ? Math.round((testMetrics.success / testMetrics.sent) * 100) : 100;
      const targetEligibleNodes = nodes.filter(n => n.data && n.data.endpoint && n.data.endpoint.trim().length > 0);

      return (
        <div className="h-full flex flex-col bg-slate-950 font-sans">
          
          {/* --- TOP STATUS BAR (HEADER) --- */}
          <header className="h-14 px-5 bg-slate-900 border-b border-slate-800 flex items-center justify-between z-20 shadow-md">
            
            {/* Logo & Brand */}
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-lg bg-sky-600/20 border border-sky-500/40 flex items-center justify-center text-sky-400">
                <Icon name="bolt" className="w-5 h-5" />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="font-semibold text-sm tracking-tight text-white">FlowCheck</h1>
                  <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-sky-950 text-sky-400 border border-sky-800">
                    v1.2 PRO
                  </span>
                </div>
                <div className="text-[11px] text-slate-400 font-mono">Real-time Architecture Load Testing</div>
              </div>
            </div>

            {/* Middle Real-time Metrics Pill */}
            <div className="hidden md:flex items-center gap-4 bg-slate-950 px-4 py-1.5 rounded-full border border-slate-800 text-xs font-mono">
              {testStatus === 'running' ? (
                <div className="flex items-center gap-2.5 text-slate-300">
                  <span className="relative flex h-2 w-2">
                    <span className={`animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${
                      currentHealth.status === 'healthy' ? 'bg-emerald-400' :
                      currentHealth.status === 'warning' ? 'bg-amber-400' : 'bg-rose-400'
                    }`}></span>
                    <span className={`relative inline-flex rounded-full h-2 w-2 ${
                      currentHealth.status === 'healthy' ? 'bg-emerald-500' :
                      currentHealth.status === 'warning' ? 'bg-amber-500' : 'bg-rose-500'
                    }`}></span>
                  </span>
                  <span><strong className="text-white">{testMetrics.sent.toLocaleString()}</strong> reqs</span>
                  <span className="text-slate-600">/</span>
                  <span><strong className="text-sky-300">{testMetrics.avgResponseTime}ms</strong> avg</span>
                  <span className="text-slate-600">/</span>
                  <span><strong className="text-white">{successRate}%</strong> ok</span>

                  </div>
                </div>

                <div className="border-t border-slate-800/80"></div>

                {/* Section: Results Summary Scorecard */}
                <div className="space-y-1.5">
                  <div className="text-[11px] font-mono text-slate-400 uppercase tracking-wider">
                    Metrics Summary
                  </div>
                  <div className="grid grid-cols-2 gap-1.5 font-mono">
                    <div className="p-2 rounded bg-slate-950 border border-slate-800">
                      <div className="text-[9px] uppercase text-slate-500">Sent</div>
                      <div className="text-sm font-semibold text-slate-100 mt-0.5">
                        {testMetrics.sent.toLocaleString()}
                      </div>
                    </div>
                    <div className="p-2 rounded bg-slate-950 border border-slate-800">
                      <div className="text-[9px] uppercase text-slate-500">Success</div>
                      <div className="text-sm font-semibold text-emerald-400 mt-0.5">
                        {testMetrics.success.toLocaleString()}
                      </div>
                    </div>
                    <div className="p-2 rounded bg-slate-950 border border-slate-800">
                      <div className="text-[9px] uppercase text-slate-500">Failed</div>
                      <div className={`text-sm font-semibold mt-0.5 ${testMetrics.failed > 0 ? 'text-rose-400' : 'text-slate-400'}`}>
                        {testMetrics.failed.toLocaleString()}
                      </div>
                    </div>
                    <div className="p-2 rounded bg-slate-950 border border-slate-800">
                      <div className="text-[9px] uppercase text-slate-500">Latency</div>
                      <div className="text-sm font-semibold text-sky-400 mt-0.5">
                        {testMetrics.avgResponseTime}<span className="text-[10px] text-slate-500">ms</span>
                      </div>
                    </div>
                  </div>
                  <div className="p-2 rounded bg-slate-950 border border-slate-800 flex items-center justify-between font-mono">
                    <div className="text-[9px] uppercase text-slate-500">Throughput</div>
                    <div className="text-xs font-semibold text-slate-200">
                      {testMetrics.rps} <span className="text-[10px] text-slate-500 font-normal">req/s</span>
                    </div>
                  </div>
                </div>

              </div>

              {/* Bottom Persistence Buttons */}
              <div className="pt-3 border-t border-slate-800/80">
                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={handleSaveFlow}
                    className="flex items-center justify-center gap-1.5 py-1.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-md font-medium border border-slate-700/80 transition"
                  >
                    <Icon name="save" className="w-3 h-3 text-sky-400" />
                    Save Flow
                  </button>
                  <button
                    onClick={handleLoadFlow}
                    className="flex items-center justify-center gap-1.5 py-1.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-md font-medium border border-slate-700/80 transition"
                  >
                    <Icon name="folder" className="w-3 h-3 text-sky-400" />
                    Load Flow
                  </button>
                </div>
              </div>
            </div>
          </div>

          {/* --- ADD NODE MODAL --- */}
          {showAddNodeModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-sm p-5 shadow-2xl space-y-3.5">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <h3 className="text-sm font-semibold text-white">Add Node</h3>
                  <button onClick={() => setShowAddNodeModal(false)} className="text-slate-400 hover:text-white text-xs">✕</button>
                </div>
                <form onSubmit={handleAddNodeSubmit} className="space-y-3">
                  <div>
                    <label className="block text-[11px] text-slate-400 mb-1">Node Name *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Auth Gateway"
                      value={nodeFormName}
                      onChange={(e) => setNodeFormName(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] text-slate-400 mb-1">Service Type</label>
                    <select
                      value={nodeFormType}
                      onChange={(e) => setNodeFormType(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500 font-mono"
                    >
                      <option value="Client">Client</option>
                      <option value="API">API Gateway</option>
                      <option value="Server">Server</option>
                      <option value="Database">Database</option>
                      <option value="Service">Service</option>
                    </select>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">Method</label>
                      <select
                        value={nodeFormMethod}
                        onChange={(e) => setNodeFormMethod(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-slate-200 font-mono"
                      >
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="DELETE">DELETE</option>
                      </select>
                    </div>
                    <div className="col-span-2">
                      <label className="block text-[11px] text-slate-400 mb-1">
                        Endpoint URL
                      </label>
                      <input
                        type="text"
                        placeholder="http://localhost:4000/api/mock/gateway"
                        value={nodeFormEndpoint}
                        onChange={(e) => setNodeFormEndpoint(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs font-mono text-slate-200 focus:outline-none focus:border-sky-500"
                      />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setShowAddNodeModal(false)}
                      className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-xs hover:bg-slate-700"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white rounded text-xs font-medium"
                    >
                      Add Node
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* --- EDIT NODE MODAL (CUSTOMIZE / CONFIGURE) --- */}
          {showEditNodeModal && selectedNode && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-sm p-5 shadow-2xl space-y-3.5">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <h3 className="text-sm font-semibold text-white">Configure Node</h3>
                  <button onClick={() => setShowEditNodeModal(false)} className="text-slate-400 hover:text-white text-xs">✕</button>
                </div>
                <form onSubmit={handleEditNodeSubmit} className="space-y-3">
                  <div>
                    <label className="block text-[11px] text-slate-400 mb-1">Node Name *</label>
                    <input
                      type="text"
                      required
                      value={nodeFormName}
                      onChange={(e) => setNodeFormName(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] text-slate-400 mb-1">Service Type</label>
                    <select
                      value={nodeFormType}
                      onChange={(e) => setNodeFormType(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500 font-mono"
                    >
                      <option value="Client">Client</option>
                      <option value="API">API Gateway</option>
                      <option value="Server">Server</option>
                      <option value="Database">Database</option>
                      <option value="Service">Service</option>
                    </select>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">Method</label>
                      <select
                        value={nodeFormMethod}
                        onChange={(e) => setNodeFormMethod(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-slate-200 font-mono"
                      >
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="DELETE">DELETE</option>
                      </select>
                    </div>
                    <div className="col-span-2">
                      <label className="block text-[11px] text-slate-400 mb-1">
                        Endpoint URL
                      </label>
                      <input
                        type="text"
                        placeholder="http://localhost:4000/api/mock/gateway"
                        value={nodeFormEndpoint}
                        onChange={(e) => setNodeFormEndpoint(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs font-mono text-slate-200 focus:outline-none focus:border-sky-500"
                      />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setShowEditNodeModal(false)}
                      className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-xs hover:bg-slate-700"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white rounded text-xs font-medium"
                    >
                      Save Changes
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* --- ADD EDGE MODAL --- */}
          {showAddEdgeModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-sm p-5 shadow-2xl space-y-3.5">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <h3 className="text-sm font-semibold text-white">Connect Nodes</h3>
                  <button onClick={() => setShowAddEdgeModal(false)} className="text-slate-400 hover:text-white text-xs">✕</button>
                </div>
                <form onSubmit={handleAddEdgeSubmit} className="space-y-3">
                  <div>
                    <label className="block text-[11px] text-slate-400 mb-1">Source Node</label>
                    <select
                      value={edgeSource}
                      onChange={(e) => setEdgeSource(e.target.value)}
                      required
                      className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500"
                    >
                      <option value="">-- Select Source --</option>
                      {nodes.map(n => (
                        <option key={n.id} value={n.id}>{n.data.name} ({n.data.serviceType})</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-[11px] text-slate-400 mb-1">Target Node</label>
                    <select
                      value={edgeTarget}
                      onChange={(e) => setEdgeTarget(e.target.value)}
                      required
                      className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500"
                    >
                      <option value="">-- Select Target --</option>
                      {nodes.filter(n => n.id !== edgeSource).map(n => (
                        <option key={n.id} value={n.id}>{n.data.name} ({n.data.serviceType})</option>
                      ))}
                    </select>
                  </div>
                  <div className="flex justify-end gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setShowAddEdgeModal(false)}
                      className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-xs hover:bg-slate-700"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white rounded text-xs font-medium"
                    >
                      Connect
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* --- CREATE NEW FLOW MODAL --- */}
          {showNewFlowModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-sm p-5 shadow-2xl space-y-3.5">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <h3 className="text-sm font-semibold text-white">Create New Flow</h3>
                  <button onClick={() => setShowNewFlowModal(false)} className="text-slate-400 hover:text-white text-xs">✕</button>
                </div>
                <form onSubmit={handleCreateFlowSubmit} className="space-y-3">
                  <div>
                    <label className="block text-[11px] text-slate-400 mb-1">Flow Name *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Auth Pipeline, Payment Flow"
                      value={flowFormName}
                      onChange={(e) => setFlowFormName(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setShowNewFlowModal(false)}
                      className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-xs hover:bg-slate-700"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white rounded text-xs font-medium"
                    >
                      Create Flow
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* --- RENAME FLOW MODAL --- */}
          {showRenameFlowModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-sm p-5 shadow-2xl space-y-3.5">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <h3 className="text-sm font-semibold text-white">Rename Flow</h3>
                  <button onClick={() => setShowRenameFlowModal(false)} className="text-slate-400 hover:text-white text-xs">✕</button>
                </div>
                <form onSubmit={handleRenameFlowSubmit} className="space-y-3">
                  <div>
                    <label className="block text-[11px] text-slate-400 mb-1">New Flow Name *</label>
                    <input
                      type="text"
                      required
                      value={flowFormName}
                      onChange={(e) => setFlowFormName(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setShowRenameFlowModal(false)}
                      className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-xs hover:bg-slate-700"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white rounded text-xs font-medium"
                    >
                      Save Name
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* --- MINIMAL TOAST --- */}
          {toastMessage && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 border border-slate-700 text-slate-200 px-3.5 py-2 rounded-lg shadow-xl text-xs font-mono flex items-center gap-2">
              <span className="w-1.5 h-1.5 rounded-full bg-sky-400"></span>
              {toastMessage}
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
